services:
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    user: root
    command: ["sh", "-c", "npm install --package-lock=false --omit=dev && exec su node -s /bin/sh -c 'node src/server.js'"]
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-dwes}
      DB_USER: ${MYSQL_USER:-dwes}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dwes}
      PASSWORD_ROUNDS: ${PASSWORD_ROUNDS:-12}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-tasks-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tasks-api-users}
    volumes:
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
      - node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dwes}
      MYSQL_USER: ${MYSQL_USER:-dwes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dwes}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  node_modules:
  mysql_data:
